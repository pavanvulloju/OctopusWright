name: Playwright Scraper (Twice Daily)

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC every day. Adjust the cron to your desired times (UTC).
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}  # allow manual runs

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers (Chromium only)
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}   # optional: set in repo secrets or use target_url.txt
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}  # optional
        run: |
          python octopus_wright.py
      - name: Upload outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-html
          path: outputs/*.html
